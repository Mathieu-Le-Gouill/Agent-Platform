name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.15"

      # --locked fails when pyproject.toml changed without a re-lock.
      - name: Install dependencies from uv.lock
        run: |
          uv sync --locked --extra dev --extra all --python 3.11
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Type-check with mypy
        run: mypy src/

      - name: Check import boundaries
        run: lint-imports

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.15"

      - name: Install FFmpeg shared libraries
        # torchcodec (pulled in by pyannote-audio 4.x, which uv only resolves on
        # 3.11) dlopen()s libav*/libsw* at import time, and sentence-transformers
        # imports it eagerly. The runner image ships no FFmpeg runtime.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies from uv.lock
        run: |
          uv sync --locked --extra dev --extra all --python ${{ matrix.python-version }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: pytest -v --cov=src/agent_platform --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker:
    name: Production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build --target production -t agent-platform:ci .

      - name: Start the container and probe /health
        run: |
          # Dummy key, not a secret: the API refuses to start without one.
          docker run -d --name ap-smoke -p 8000:8000 \
            -e 'AGENT_PLATFORM_API_KEYS=["ci-smoke"]' agent-platform:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs ap-smoke
          exit 1

  evals:
    name: Evals
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.15"

      - name: Install FFmpeg shared libraries
        # torchcodec (pulled in by pyannote-audio 4.x, which uv only resolves on
        # 3.11) dlopen()s libav*/libsw* at import time, and sentence-transformers
        # imports it eagerly. The runner image ships no FFmpeg runtime.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies from uv.lock
        run: |
          uv sync --locked --extra dev --extra all --python 3.11
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run golden eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: agent-platform-eval src/agent_platform/evals/datasets/conversation_tool_selection.jsonl --provider OpenAILLM --scorer tool-selection --threshold 0.7
