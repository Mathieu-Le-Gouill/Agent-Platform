[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_platform"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    # --- Core ---
    "langchain",
    "langgraph",
    "langsmith",
    "soundfile",

    # --- LLM ---
    "langchain-openai",
    "langchain-anthropic",
    "langchain-mistralai",
    "langchain-ollama",
    "langchain-community",

    # --- Embeddings / Vector Stores / Reranking ---
    "langchain-chroma",
    "langchain-cohere",
    "langchain-qdrant",

    # --- OCR ---
    "pytesseract",
    "boto3",
    "google-cloud-vision",

    # --- Speech-to-Text ---
    "numpy",
    "whisperx",
    "deepgram-sdk",

    # --- Translation ---
    "deepl",
    "googletrans==4.0.0rc1",

    # --- VAD ---
    "silero-vad",
    "webrtcvad",
    "ten-vad @ git+https://github.com/TEN-framework/ten-vad.git@22a3bcd4509d0faaa8eef4881e8af5f39c178950",

    # --- Classification ---
    "transformers",

    # --- Clustering ---
    "hdbscan",
    "scikit-learn",

    # --- Image Generation ---
    "diffusers[torch]",
    "accelerate",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "import-linter",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
platform = "agent_platform.main:main"