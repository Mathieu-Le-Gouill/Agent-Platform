[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_platform"
version = "0.1.0"
requires-python = ">=3.11,<3.13"

dependencies = [
    # --- Core ---
    "langchain~=1.3",
    "langgraph~=1.2",
    "langsmith~=0.10",
    "langfuse~=2.0",
    "soundfile",

    # --- LLM ---
    "langchain-openai~=1.3",
    "langchain-anthropic~=1.4",
    "langchain-mistralai~=1.1",
    "langchain-ollama~=1.1",
    "langchain-community~=0.4",

    # --- Embeddings / Vector Stores / Reranking ---
    "langchain-chroma~=1.1",
    "langchain-cohere~=0.6",
    "langchain-qdrant~=1.1",
    "langchain-pinecone~=0.2",
    "langchain-weaviate~=0.0.8",
    "langchain-voyageai~=0.4",
    "faiss-cpu",

    # --- OCR ---
    "pytesseract",
    "boto3",
    "google-cloud-vision",
    "mistralai",

    # --- Speech-to-Text ---
    "numpy",
    "whisperx",
    "faster-whisper",
    "deepgram-sdk",
    "openai",

    # --- Translation ---
    "deepl",
    "google-cloud-translate",
    "azure-ai-translation-text",

    # --- VAD ---
    "silero-vad",
    "webrtcvad",
    "ten-vad @ git+https://github.com/TEN-framework/ten-vad.git@22a3bcd4509d0faaa8eef4881e8af5f39c178950",

    # --- Reranking ---
    "flashrank",

    # --- Classification ---
    "transformers",

    # --- Chunking (structure-based) ---
    "beautifulsoup4",
    "unstructured[pdf]",

    # --- Clustering ---
    "hdbscan",
    "scikit-learn",

    # --- Image Generation ---
    "diffusers[torch]",
    "accelerate",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "import-linter",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_platform = ["py.typed"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
