[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_platform"
version = "0.1.0"
description = "A project to build agents with LLMs and graph-based reasoning."
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Mathieu Le Gouill", email = "mathieulegouill@outlook.com" }
]
license = "MIT"

dependencies = [
    "openai",
    "anthropic",
    "mistralai",
    "langchain",
    "langgraph",
    "langsmith",
    "ollama",
    "soundfile",
    "langchain-chroma"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "import-linter",
]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
platform = "platform.main:main"