[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_platform"
version = "0.1.0"
description = "A project to build agents with LLMs and graph-based reasoning."
readme = "README.md"
requires-python = ">=3.11,<3.12"

authors = [
    { name = "Mathieu Le Gouill", email = "mathieulegouill@outlook.com" }
]
license = "MIT"

dependencies = [
    "langchain",
    "langgraph",
    "langsmith",
    "soundfile",
    "langchain-chroma",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-mistralai",
    "langchain-ollama",
    "langchain-community",
    "langchain-cohere",
    "langchain-qdrant",
    "pytesseract",
    "boto3",
    "google-cloud-vision",
    "silero-vad",
    "webrtcvad",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "import-linter",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.scripts]
platform = "agent_platform.main:main"

[tool.poetry]
name = "agent_platform"
version = "0.1.0"

packages = [
    { include = "agent_platform" }
]