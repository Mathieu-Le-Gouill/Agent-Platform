[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_platform"
version = "0.1.0"
description = "Async-first, pydantic v2 platform for composable LLM agents and pipelines (RAG, speech translation, ingestion) over pluggable provider integrations."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Mathieu Le Gouill", email = "mathieulegouill@outlook.com" },
]
keywords = ["agents", "llm", "rag", "pipelines", "langchain"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
    # --- Core framework (always installed) ---
    "langchain~=1.3",
    "langgraph~=1.2",
    "langsmith~=0.10",
    "langfuse~=2.0",
    "numpy",
    "pillow",
    "pydantic-settings~=2.0",
]

[project.optional-dependencies]
# --- LLM ---
llm-openai = ["langchain-openai~=1.3"]
llm-anthropic = ["langchain-anthropic~=1.4"]
llm-mistral = ["langchain-mistralai~=1.1"]
llm-ollama = ["langchain-ollama~=1.1"]
llm-huggingface = ["langchain-huggingface"]
llm = ["agent_platform[llm-openai,llm-anthropic,llm-mistral,llm-ollama,llm-huggingface]"]

# --- Embeddings ---
embeddings-openai = ["langchain-openai~=1.3"]
embeddings-mistral = ["langchain-mistralai~=1.1"]
embeddings-ollama = ["langchain-ollama~=1.1"]
embeddings-huggingface = ["langchain-huggingface"]
embeddings = ["agent_platform[embeddings-openai,embeddings-mistral,embeddings-ollama,embeddings-huggingface]"]

# --- Vector Stores ---
vector-store-chroma = ["langchain-chroma~=1.1"]
vector-store-faiss = ["faiss-cpu", "langchain-community~=0.4"]
vector-store-pinecone = ["langchain-pinecone~=0.2"]
vector-store-qdrant = ["langchain-qdrant~=1.1"]
vector-store-weaviate = ["langchain-weaviate~=0.0.8"]
vector-store = ["agent_platform[vector-store-chroma,vector-store-faiss,vector-store-pinecone,vector-store-qdrant,vector-store-weaviate]"]

# --- Reranking ---
reranking-cohere = ["langchain-cohere~=0.6"]
reranking-jina = ["langchain-community~=0.4"]
reranking-huggingface = ["langchain-community~=0.4"]
reranking-flashrank = ["flashrank"]
reranking-voyage = ["langchain-voyageai~=0.4"]
reranking = ["agent_platform[reranking-cohere,reranking-jina,reranking-huggingface,reranking-flashrank,reranking-voyage]"]

# --- Speech-to-Text ---
stt-whisperx = ["whisperx"]
stt-faster-whisper = ["faster-whisper"]
stt-deepgram = ["deepgram-sdk"]
stt-openai = ["openai"]
stt = ["agent_platform[stt-whisperx,stt-faster-whisper,stt-deepgram,stt-openai]"]

# --- Translation ---
translation-deepl = ["deepl"]
translation-google = ["google-cloud-translate"]
translation-azure = ["azure-ai-translation-text"]
translation = ["agent_platform[translation-deepl,translation-google,translation-azure]"]

# --- OCR ---
ocr-tesseract = ["pytesseract"]
ocr-google-vision = ["google-cloud-vision"]
ocr-aws-textract = ["boto3"]
ocr-mistral = ["mistralai"]
ocr = ["agent_platform[ocr-tesseract,ocr-google-vision,ocr-aws-textract,ocr-mistral]"]

# --- VAD ---
vad-silero = ["silero-vad", "torch"]
vad-webrtc = ["webrtcvad"]
vad-pvcobra = ["pvcobra"]
vad-ten = ["ten-vad @ git+https://github.com/TEN-framework/ten-vad.git@22a3bcd4509d0faaa8eef4881e8af5f39c178950"]
vad = ["agent_platform[vad-silero,vad-webrtc,vad-pvcobra,vad-ten]"]

# --- Image Generation ---
image-dalle = ["openai"]
image-midjourney = ["httpx"]
image-stable-diffusion = ["diffusers[torch]", "accelerate"]
image = ["agent_platform[image-dalle,image-midjourney,image-stable-diffusion]"]

# --- Clustering ---
clustering-hdbscan = ["hdbscan"]
clustering-kmeans = ["scikit-learn"]
clustering = ["agent_platform[clustering-hdbscan,clustering-kmeans]"]

# --- Classification ---
classification-transformers = ["transformers"]

# --- API ---
api = ["fastapi~=0.121", "uvicorn[standard]~=0.34"]

# --- Chunking (structure-based) ---
chunking-recursive = ["langchain-text-splitters~=1.0"]
chunking-html = ["langchain-text-splitters~=1.0"]
chunking-latex = ["langchain-text-splitters~=1.0"]
chunking-markdown = ["langchain-text-splitters~=1.0"]
chunking-pdf = ["unstructured[pdf]"]
chunking = ["agent_platform[chunking-recursive,chunking-html,chunking-latex,chunking-markdown,chunking-pdf]"]

# --- Loader strategies ---
loader-av = ["av"]
loader-soundfile = ["soundfile"]

# --- Everything (parity with the old monolithic install) ---
all = [
    "agent_platform[llm,embeddings,vector-store,reranking,stt,translation,ocr,vad,image,clustering,classification-transformers,chunking,loader-av,loader-soundfile,api]",
]

dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "import-linter",
    "httpx",
]

[project.urls]
Repository = "https://github.com/Mathieu-Le-Gouill/Agent-Platform"
Issues = "https://github.com/Mathieu-Le-Gouill/Agent-Platform/issues"

[project.scripts]
agent-platform-api = "agent_platform.api.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_platform = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agent_platform"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]

[tool.mypy]
python_version = "3.12"
packages = ["agent_platform"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast, no external services",
    "integration: hits a real external provider/network",
]

[tool.importlinter]
root_package = "agent_platform"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "agent_platform.agents",
    "agent_platform.pipelines",
    "agent_platform.components",
    "agent_platform.integrations",
    "agent_platform.core",
]

[[tool.importlinter.contracts]]
name = "Core has no sibling-layer dependencies"
type = "forbidden"
source_modules = ["agent_platform.core"]
forbidden_modules = [
    "agent_platform.integrations",
    "agent_platform.components",
    "agent_platform.pipelines",
    "agent_platform.agents",
]
