<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect x="0" y="0" width="640" height="360" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="12" fill="#111111">
    <rect x="20" y="20" width="600" height="40" fill="#eef2f7" stroke="#334"/>
    <text x="320" y="45" text-anchor="middle">Host product (owns ids, auth, tenancy, retries of failed turns)</text>

    <rect x="20" y="100" width="180" height="60" fill="#ffffff" stroke="#334"/>
    <text x="110" y="125" text-anchor="middle">ConversationAgent</text>
    <text x="110" y="143" text-anchor="middle">turn lock (D1), limits (D4)</text>

    <rect x="230" y="100" width="180" height="60" fill="#ffffff" stroke="#334"/>
    <text x="320" y="125" text-anchor="middle">LLM call path</text>
    <text x="320" y="143" text-anchor="middle">retry + fallback (D5)</text>

    <rect x="440" y="100" width="180" height="60" fill="#ffffff" stroke="#334"/>
    <text x="530" y="125" text-anchor="middle">MCP clients</text>
    <text x="530" y="143" text-anchor="middle">startup timeout, cleanup (D6)</text>

    <rect x="20" y="200" width="180" height="60" fill="#ffffff" stroke="#334"/>
    <text x="110" y="225" text-anchor="middle">WorkflowGraph</text>
    <text x="110" y="243" text-anchor="middle">checkpoint per node (D2)</text>

    <rect x="230" y="200" width="180" height="60" fill="#fff8e6" stroke="#334"/>
    <text x="320" y="222" text-anchor="middle">Store protocol (core)</text>
    <text x="320" y="238" text-anchor="middle">save/load + versioned</text>
    <text x="320" y="254" text-anchor="middle">JSON codec (D1)</text>

    <rect x="230" y="300" width="180" height="44" fill="#ffffff" stroke="#334"/>
    <text x="320" y="326" text-anchor="middle">SQLite backend (D3)</text>

    <line x1="110" y1="60" x2="110" y2="92" stroke="#334"/>
    <polygon points="104,92 116,92 110,100" fill="#334"/>
    <line x1="200" y1="130" x2="222" y2="130" stroke="#334"/>
    <polygon points="222,124 222,136 230,130" fill="#334"/>
    <line x1="410" y1="130" x2="432" y2="130" stroke="#334"/>
    <polygon points="432,124 432,136 440,130" fill="#334"/>
    <line x1="150" y1="160" x2="262" y2="194" stroke="#334"/>
    <polygon points="258,188 263,199 270,196" fill="#334"/>
    <line x1="200" y1="230" x2="222" y2="230" stroke="#334"/>
    <polygon points="222,224 222,236 230,230" fill="#334"/>
    <line x1="320" y1="260" x2="320" y2="292" stroke="#334"/>
    <polygon points="314,292 326,292 320,300" fill="#334"/>
  </g>
</svg>
